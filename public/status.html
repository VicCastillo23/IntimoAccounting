<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>Estado del servicio · Íntimo Contabilidad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="app-shell">
    <div class="nav-backdrop" id="nav-backdrop" aria-hidden="true"></div>
    <header class="app-mobile-bar" id="app-mobile-bar">
      <button
        type="button"
        class="app-mobile-bar__menu"
        id="btn-sidebar-toggle"
        aria-expanded="false"
        aria-controls="app-sidebar"
        aria-label="Abrir menú de navegación"
      >
        <span class="material-symbols-outlined" aria-hidden="true">menu</span>
      </button>
      <div class="app-mobile-bar__brand">
        <span class="app-mobile-bar__wordmark">Íntimo</span>
        <span class="app-mobile-bar__sub">Contabilidad</span>
      </div>
    </header>
    <aside class="sidebar" id="app-sidebar" aria-label="Navegación">
      <div class="sidebar__brand">
        <div class="sidebar__wordmark" aria-hidden="true">Íntimo</div>
        <p class="sidebar__app-label">Contabilidad</p>
      </div>
      <p class="sidebar__session" id="session-label"><span id="session-user"></span></p>
      <nav class="sidebar__nav" aria-label="Módulos"></nav>
      <p class="sidebar__foot">Datos en reposo cifrados (AES-256-GCM). HTTPS en producción.</p>
    </aside>

    <main class="main">
      <header class="main__header">
        <h1 class="main__h1">Estado del servicio</h1>
        <p class="main__lead">Comprobación del endpoint de salud del servidor de contabilidad.</p>
      </header>
      <section class="panel placeholder-panel">
        <p id="status-label" class="placeholder-tbd">Comprobando…</p>
        <p id="status-detail" class="placeholder-soon" hidden></p>
        <button type="button" class="btn btn--ghost btn--sm" id="btn-status-refresh" style="margin-top:1rem">Actualizar</button>
      </section>
    </main>
  </div>
  <script type="module" src="/js/status.js"></script>
</body>
</html>
