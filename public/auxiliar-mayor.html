<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>Auxiliares de mayor · Íntimo Contabilidad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/print-nif.css" />
</head>
<body>
  <div class="app-shell">
    <div class="nav-backdrop" id="nav-backdrop" aria-hidden="true"></div>
    <header class="app-mobile-bar" id="app-mobile-bar">
      <button type="button" class="app-mobile-bar__menu" id="btn-sidebar-toggle" aria-expanded="false" aria-controls="app-sidebar" aria-label="Abrir menú de navegación">
        <span class="material-symbols-outlined" aria-hidden="true">menu</span>
      </button>
      <div class="app-mobile-bar__brand">
        <img class="app-mobile-bar__logo" src="/assets/intimo-sidebar-logo.png" alt="Íntimo" decoding="async" />
      </div>
    </header>
    <aside class="sidebar" id="app-sidebar" aria-label="Navegación">
      <div class="sidebar__brand">
        <img class="sidebar__brand-icon" src="/assets/intimo-sidebar-logo.png" alt="Íntimo" decoding="async" />
      </div>
      <p class="sidebar__session" id="session-label"><span id="session-user"></span></p>
      <nav class="sidebar__nav" aria-label="Módulos"></nav>
      <script src="/js/sidebar-boot.js"></script>
      <p class="sidebar__foot">Movimientos según pólizas registradas en el ejercicio.</p>
    </aside>

    <main class="main main--report">
      <div id="report-print-header" class="report-print-header-wrap" aria-hidden="true"></div>
      <header class="main__header main__header--compact">
        <h1 class="main__h1">Auxiliares de mayor</h1>
      </header>

      <div class="report-toolbar panel">
        <div class="report-toolbar__dates">
          <label class="report-field report-field--account">
            <span>Cuenta (NumCta)</span>
            <select id="aux-account" class="report-field__input" aria-label="Cuenta de mayor">
              <option value="">— Elegir cuenta —</option>
            </select>
          </label>
          <label class="report-field"><span>Desde</span><input type="date" id="report-from" class="report-field__input" /></label>
          <label class="report-field"><span>Hasta</span><input type="date" id="report-to" class="report-field__input" /></label>
          <button type="button" class="btn btn--primary btn--sm" id="btn-report-apply">Actualizar</button>
          <button type="button" class="btn btn--ghost btn--sm" id="btn-report-print" title="Imprimir">
            <span class="material-symbols-outlined" aria-hidden="true">print</span>
            Imprimir
          </button>
        </div>
        <p class="report-toolbar__hint" id="report-meta"></p>
      </div>
      <div id="report-alert" class="report-alert-slot"></div>

      <section class="report-section panel">
        <div class="table-wrap table-wrap--sticky-head">
          <table class="data-table data-table--dense report-table auxiliar-table">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Folio</th>
                <th>Tipo</th>
                <th>Concepto póliza</th>
                <th>Concepto línea</th>
                <th class="report-num">Debe</th>
                <th class="report-num">Haber</th>
                <th class="report-num">Saldo</th>
              </tr>
            </thead>
            <tbody id="aux-tbody">
              <tr><td colspan="8" class="data-table__empty">Elige una cuenta y pulsa Actualizar.</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script src="/js/auxiliar-mayor.js" type="module"></script>
</body>
</html>
