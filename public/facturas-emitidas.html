<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>Íntimo · Facturas emitidas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/print-nif.css" />
</head>
<body>
  <div class="app-shell">
    <div class="nav-backdrop" id="nav-backdrop" aria-hidden="true"></div>
    <header class="app-mobile-bar" id="app-mobile-bar">
      <button type="button" class="app-mobile-bar__menu" id="btn-sidebar-toggle" aria-expanded="false" aria-controls="app-sidebar" aria-label="Abrir menú de navegación">
        <span class="material-symbols-outlined" aria-hidden="true">menu</span>
      </button>
      <div class="app-mobile-bar__brand">
        <img class="app-mobile-bar__logo" src="/assets/intimo-sidebar-logo.png" alt="Íntimo" decoding="async" />
      </div>
    </header>
    <aside class="sidebar" id="app-sidebar" aria-label="Navegación">
      <div class="sidebar__brand">
        <img class="sidebar__brand-icon" src="/assets/intimo-sidebar-logo.png" alt="Íntimo" decoding="async" />
      </div>
      <p class="sidebar__session" id="session-label"><span id="session-user"></span></p>
      <nav class="sidebar__nav" aria-label="Módulos"></nav>
      <script src="/js/sidebar-boot.js"></script>
      <p class="sidebar__foot">Datos en reposo cifrados (AES-256-GCM). HTTPS en producción.</p>
    </aside>

    <main class="main main--report main--report-invoices main--invoices-compact">
      <header class="main__header main__header--compact">
        <h1 class="main__h1">Facturas emitidas</h1>
      </header>

      <input id="fe-zip" class="visually-hidden" type="file" accept=".zip,application/zip" tabindex="-1" aria-hidden="true" />

      <div class="report-toolbar report-toolbar--inline invoices-actions">
        <label class="report-field">Fecha póliza masiva
          <input id="fe-batch-date" class="report-field__input" type="date" />
        </label>
        <button id="fe-batch-btn" class="btn btn--primary" type="button">Crear una póliza con seleccionadas</button>
        <button id="fe-delete-btn" class="btn btn--ghost" type="button">
          <span class="material-symbols-outlined btn__icon" aria-hidden="true">delete</span>
          Eliminar facturas
        </button>
        <button id="fe-import-btn" class="btn btn--ghost" type="button">
          <span class="material-symbols-outlined btn__icon" aria-hidden="true">folder_zip</span>
          Importar ZIP
        </button>
        <p class="report-toolbar__hint" id="fe-batch-meta">Selecciona facturas emitidas en la tabla.</p>
      </div>
      <div id="fe-poliza-accounts-note" class="alert alert--error" hidden role="status"></div>

      <section class="panel report-section report-section--flush invoices-detail-panel">
        <div id="fe-detail" class="report-muted">Selecciona una factura para ver su detalle.</div>
      </section>

      <section class="panel report-section report-section--flush invoices-list-panel">
        <div class="report-toolbar fe-filter-meta invoices-list-meta">
          <p class="report-toolbar__hint" id="fe-filter-meta">Mostrando todas las facturas.</p>
          <button id="fe-clear-filters" class="btn btn--text" type="button">Limpiar filtros</button>
        </div>
        <div class="table-wrap table-wrap--sticky-head fe-table-wrap">
          <table id="fe-table" class="data-table data-table--dense data-table--col-filters">
            <thead>
              <tr>
                <th class="col-head col-head--check"><input id="fe-check-all" type="checkbox" aria-label="Seleccionar todo" /></th>
                <th class="col-head" data-col="uuid">
                  <div class="col-head__row">
                    <span class="col-head__label">UUID</span>
                    <button type="button" class="col-filter-btn" data-col="uuid" aria-label="Filtrar UUID" aria-haspopup="dialog">
                      <span class="material-symbols-outlined" aria-hidden="true">filter_alt</span>
                    </button>
                  </div>
                </th>
                <th class="col-head" data-col="serie">
                  <div class="col-head__row">
                    <span class="col-head__label">Serie/Folio</span>
                    <button type="button" class="col-filter-btn" data-col="serie" aria-label="Filtrar serie/folio" aria-haspopup="dialog">
                      <span class="material-symbols-outlined" aria-hidden="true">filter_alt</span>
                    </button>
                  </div>
                </th>
                <th class="col-head" data-col="fecha">
                  <div class="col-head__row">
                    <span class="col-head__label">Fecha</span>
                    <button type="button" class="col-filter-btn" data-col="fecha" aria-label="Filtrar fecha" aria-haspopup="dialog">
                      <span class="material-symbols-outlined" aria-hidden="true">filter_alt</span>
                    </button>
                  </div>
                </th>
                <th class="col-head" data-col="rfc">
                  <div class="col-head__row">
                    <span class="col-head__label">RFC cliente</span>
                    <button type="button" class="col-filter-btn" data-col="rfc" aria-label="Filtrar RFC" aria-haspopup="dialog">
                      <span class="material-symbols-outlined" aria-hidden="true">filter_alt</span>
                    </button>
                  </div>
                </th>
                <th class="col-head data-table__num" data-col="total">
                  <div class="col-head__row col-head__row--end">
                    <span class="col-head__label">Total</span>
                    <button type="button" class="col-filter-btn" data-col="total" aria-label="Filtrar total" aria-haspopup="dialog">
                      <span class="material-symbols-outlined" aria-hidden="true">filter_alt</span>
                    </button>
                  </div>
                </th>
                <th class="col-head" data-col="estatus">
                  <div class="col-head__row">
                    <span class="col-head__label">Estatus</span>
                    <button type="button" class="col-filter-btn" data-col="estatus" aria-label="Filtrar estatus" aria-haspopup="dialog">
                      <span class="material-symbols-outlined" aria-hidden="true">filter_alt</span>
                    </button>
                  </div>
                </th>
                <th class="col-head" data-col="poliza">
                  <div class="col-head__row">
                    <span class="col-head__label">Póliza</span>
                    <button type="button" class="col-filter-btn" data-col="poliza" aria-label="Filtrar póliza" aria-haspopup="dialog">
                      <span class="material-symbols-outlined" aria-hidden="true">filter_alt</span>
                    </button>
                  </div>
                </th>
                <th class="col-head"><span class="col-head__label">XML</span></th>
                <th class="col-head"><span class="col-head__label">PDF</span></th>
              </tr>
            </thead>
            <tbody id="fe-tbody"></tbody>
          </table>
        </div>
        <nav id="fe-pager" class="invoices-pager" aria-label="Paginación de facturas emitidas"></nav>
        <div id="fe-col-menu" class="col-menu" hidden role="dialog" aria-label="Filtro de columna"></div>
      </section>
    </main>
  </div>
  <script type="module" src="/js/facturas-emitidas.js"></script>
</body>
</html>
